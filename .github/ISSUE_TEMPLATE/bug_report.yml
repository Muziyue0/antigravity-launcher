name: 故障反馈
description: 使用固定字段诊断报告反馈，不上传完整配置或日志
title: "[故障] "
body:
  - type: markdown
    attributes:
      value: "请勿上传订阅、节点密码、Token、OAuth 授权码、账号截图、完整 YAML 或原始 CLI 输出。"
  - type: input
    id: version
    attributes:
      label: 启动器版本及 Windows 版本
      placeholder: v1.10.0-beta.1 / Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 故障发生阶段
      options:
        - 首次配置或 CLI 下载
        - 网络检测
        - CLI 真实模型检测
        - 桌面启动或真实对话
        - 使用中恢复
        - 托盘、退出或清理
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期与实际结果
      description: 说明是否改过模型、是否直接重开过客户端；请删除个人信息。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 可选的固定字段诊断
      description: 从启动助手托盘菜单导出，不粘贴完整日志或设置。
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查内容不含凭据、订阅、授权码或账号信息。
          required: true
